# O diagnóstico do que está no ar, todo dia.
#
# O comando existe (`pnpm --filter @vivio/banco diagnostico`) e confere 18
# coisas: páginas públicas, cabeçalhos de segurança, se a função de borda está
# publicada, se a rotina de lembretes rodou, sobras de execução de teste, chaves
# de mídia sem arquivo. Rodado à mão, ele só encontra problema no dia em que
# alguém lembra de rodá-lo — e os dois defeitos mais caros desta migração (o
# disparo de lembretes que morreu com a API e a trilha de auditoria que parou de
# ser escrita) passaram semanas assim, sem ninguém notar.
#
# Aqui ele roda sozinho. Falhando, o GitHub avisa por e-mail — que é o
# monitoramento mais simples que dá para ter sem contratar serviço nenhum.
#
# ## Os segredos que ele precisa
#
# Em Settings → Secrets and variables → Actions, no repositório:
#   SUPABASE_URL          o endereço do projeto (https://<ref>.supabase.co)
#   SUPABASE_POOLER_URL   a conexão do pooler (tem IPv4; a direta é só IPv6)
#
# ## Sem eles, o trabalho FALHA — e por que deixou de "avisar e encerrar"
#
# A primeira versão, sem os segredos, deixava um aviso e terminava verde. A ideia
# era não ensinar ninguém a ignorar vermelho por configuração ausente. O efeito
# foi o contrário do pretendido: entre 24/10 e 05/11/2026 o "Diagnóstico" ficou
# verde TODO DIA sem ter diagnosticado nada — o passo que confere o banco foi
# pulado em todas as execuções, porque os segredos nunca foram cadastrados. Um
# verde que não olhou é pior que um vermelho: ele diz "está tudo certo".
#
# Agora, sem segredos, ele falha com a explicação do que cadastrar. O e-mail do
# GitHub passa a ser o lembrete — que é exatamente o serviço que ele devia
# prestar.
name: Diagnóstico

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília, dia útil ou não.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # A v5 liga sozinha o cache do gerenciador quando o package.json declara
          # `packageManager` — e procura o pnpm ANTES do `corepack enable`, que é o
          # passo seguinte. Sem esta linha a v5 morre com "Unable to locate
          # executable file: pnpm" (foi o primeiro push com ela, em 05/11/2026).
          package-manager-cache: false

      - run: corepack enable

      - name: Os segredos existem?
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_POOLER_URL" ]; then
            echo "::error::Sem SUPABASE_URL e SUPABASE_POOLER_URL nos segredos do repositório (Settings → Secrets and variables → Actions), o diagnóstico NÃO roda. Este trabalho falha de propósito: verde sem olhar foi o que aconteceu por semanas."
            exit 1
          fi

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Gerar o cliente do Prisma
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: pnpm --filter @vivio/banco exec prisma generate

      - name: Compilar o que o diagnóstico importa
        run: pnpm --filter @vivio/contracts run build

      - name: Diagnosticar
        # Sai com código 1 se algo reprovar, e é isso que torna o trabalho
        # vermelho. Nota (arquivo órfão, conta real no banco) não reprova.
        run: pnpm --filter @vivio/banco run diagnostico
