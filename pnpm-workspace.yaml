packages:
  - "apps/*"
  - "packages/*"

# O Metro (React Native) resolve módulos assumindo node_modules plano. Pacotes
# internos do Expo importam dependências que não declaram
# (@expo/metro-runtime -> @expo/log-box -> stacktrace-parser, expo-router ->
# @babel/runtime...), e sob o layout isolado do pnpm o bundle quebra em cadeia.
# `hoisted` reproduz o layout do npm — modo recomendado para React Native.
nodeLinker: hoisted

# pnpm bloqueia scripts de pós-instalação por padrão (supply chain).
# Liberar apenas o que realmente precisa executar na instalação.
allowBuilds:
  '@prisma/client': true # gera o client tipado
  '@prisma/engines': true # baixa os binarios do engine
  prisma: true # CLI de migracao
  esbuild: true # baixa o binario nativo (usado por tsx/vitest)
  '@scarf/scarf': false # telemetria — sem uso para nos
  '@swc/core': true # binario nativo; compila decorators nos testes
  sharp: true # binario nativo de imagem, usado pelo next/image

minimumReleaseAgeExclude:
  - expo-updates@57.0.13
